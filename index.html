function openControls(returnTo){
  returnTo = returnTo || 'menu';
  const goBack = ()=> returnTo==='pause' ? openPause() : menu();
  const rows = pn => ACTIONS.map(([a,label])=>`
    <div class="item"><div style="margin:0;color:#dfe8ed;font-size:13px">${label}</div>
    <button class="opt" data-pn="${pn}" data-act="${a}">${keyLabel(BINDINGS[pn][a])}</button></div>`).join('');
  showOverlay(`
    <button class="closeX" id="closeControlsX" aria-label="Close">✕</button>
    <h1 style="font-size:28px">Controls</h1>
    <p class="lede">Click a key, then press whatever you want to bind it to. Binding a key
    that's already in use clears it from wherever it was.</p>
    <div class="lbl" style="margin-top:16px;color:#f2c14e">PLAYER 1</div>
    <div class="shelf">${rows(1)}</div>
    <div class="lbl" style="margin-top:16px;color:#4ec9f2">PLAYER 2</div>
    <div class="shelf">${rows(2)}</div>
    <button class="opt" id="resetBinds" style="margin-top:14px;width:100%">Reset to defaults</button>
    <button class="go" id="backToMenu">${returnTo==='pause' ? 'Back to pause menu' : 'Back'}</button>
  `);
  document.getElementById('closeControlsX').onclick = goBack;
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=>{
      const prev = b.textContent;
      b.textContent = 'Press a key…';
      const handler = (e)=>{
        e.preventDefault(); e.stopPropagation();
        const key = e.key.toLowerCase();
        if(key==='escape'){ removeEventListener('keydown', handler, true); openControls(returnTo); return; }
        const pn = +b.dataset.pn, act = b.dataset.act;
        for(const p of [1,2]) for(const a in BINDINGS[p]) if(BINDINGS[p][a]===key) BINDINGS[p][a]=null;
        BINDINGS[pn][act] = key;
        removeEventListener('keydown', handler, true);
        openControls(returnTo);
      };
      addEventListener('keydown', handler, true);
    };
  });
  document.getElementById('resetBinds').onclick = ()=>{
    BINDINGS = {
      1:{up:'w',down:'s',left:'a',right:'d',shoot:'j',pass:'k',hit:'l',swap:'q'},
      2:{up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright',shoot:'/',pass:'.',hit:',',swap:'m'}
    };
    openControls(returnTo);
  };
  document.getElementById('backToMenu').onclick = goBack;
}

function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function openCareerHub(returnTo){
  returnTo = returnTo || 'menu';
  const goBack = ()=> returnTo==='pause' ? openPause() : menu();
  const rows = Object.entries(UPGRADES).map(([key,U])=>{
    const lvl = CAREER.upgrades[key]||0;
    const maxed = lvl>=MAX_LEVEL;
    const cost = maxed ? null : upgradeCost(lvl);
    const pips = Array.from({length:MAX_LEVEL}, (_,i)=> i<lvl ? '●' : '○').join(' ');
    return `<div class="item"><div class="txt" style="flex:1"><div class="t">${U.label} <span style="color:#4ec9f2;letter-spacing:.15em">${pips}</span></div>
      <div class="d">${U.desc}</div></div>
      <button class="opt" data-up="${key}" ${maxed||CAREER.points<cost?'disabled':''}>${maxed?'MAX':'Upgrade — '+cost+' pts'}</button></div>`;
  }).join('');
  showOverlay(`
    <button class="closeX" id="closeCareerX" aria-label="Close">✕</button>
    <h1 style="font-size:28px">Career Upgrades</h1>
    <p class="lede">Earn points by playing Career mode games — goals, hits, takeaways, and
    a bonus for the win all count. Upgrades apply to your whole roster, only in Career games.</p>
    <div class="row" style="margin-top:4px">
      <div class="opt" style="cursor:default;font-weight:800;color:#f2c14e">★ ${CAREER.points} points</div>
      <div class="opt" style="cursor:default">${CAREER.games} career game${CAREER.games===1?'':'s'} played</div>
    </div>
    <div class="shelf" style="margin-top:14px">${rows}</div>
    <button class="go" id="closeCareer">Back</button>
  `);
  document.getElementById('closeCareerX').onclick = goBack;
  document.getElementById('closeCareer').onclick = goBack;
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
    const key = b.dataset.up, lvl = CAREER.upgrades[key]||0;
    if(lvl>=MAX_LEVEL) return;
    const cost = upgradeCost(lvl);
    if(CAREER.points<cost) return;
    CAREER.points -= cost; CAREER.upgrades[key] = lvl+1; saveCareer();
    openCareerHub(returnTo);
  });
}

    return `

          <input type="text" id="teamName${t}" maxlength="26" value="${escapeAttr(T.name)}"></div>

        <div class="field colorRow"><label>Jersey colour</label>
          <input type="color" id="teamColor${t}" value="${T.jersey}"></div>
        ${T.roster.map((r,i)=>`
        <div class="field"><label>${posLabel[i]} — #${r.n}</label>
          <input type="text" id="p${t}_${i}" maxlength="18" value="${escapeAttr(r.name)}"></div>`).join('')}
      </div>`;
  };
  showOverlay(`
    <button class="closeX" id="closeTeamsX" aria-label="Close">✕</button>
    <h1 style="font-size:28px">Teams &amp; Roster</h1>
    <p class="lede">Rename either club, the short name shown on the scoreboard and in the
    commentary, the jersey colour, and every player on both rosters.</p>
    <div class="teamGrid">
      ${teamBlock(0)}
      ${teamBlock(1)}
    </div>
    <button class="go" id="saveTeams" style="margin-top:18px">Save</button>
    <button class="opt" id="cancelTeams" style="margin-top:10px;width:100%">${returnTo==='pause' ? 'Cancel — back to pause menu' : 'Cancel'}</button>
  `);
  document.getElementById('closeTeamsX').onclick = goBack;
  document.getElementById('cancelTeams').onclick = goBack;
  document.getElementById('saveTeams').onclick = ()=>{
    for(let t=0;t<2;t++){
      const T = TEAMS[t];
      const nm = document.getElementById('teamName'+t).value.trim();
      const sh = document.getElementById('teamShort'+t).value.trim();
      const col = document.getElementById('teamColor'+t).value;
      if(nm) T.name = nm;
      if(sh) T.short = sh;
      T.abbr = (T.short.slice(0,2) || T.abbr).toUpperCase();
      if(col) T.jersey = col;
      T.roster.forEach((r,i)=>{
        const v = document.getElementById(`p${t}_${i}`).value.trim();
        if(v) r.name = v;
      });
    }
    // player objects already in play copied their name/number at game-start time —
    // resync them so a rename from the pause screen takes effect this game, not just the next
    if(G && G.players){
      for(const p of G.players){
        const info = TEAMS[p.team] && TEAMS[p.team].roster[p.idx];
        if(info){ p.name = info.name; p.num = info.n; }
      }
    }
    if(G && G.state!=='menu') updateBoard();
    goBack();
  };
}

function intermissionCard(title, lede){
  const s0=G.stats[0], s1=G.stats[1];
  return `
    <h1 style="font-size:28px">${title}</h1>
    <p class="lede">${lede}</p>
    <table class="stats">
      <tr><th></th><th>G</th><th>SOG</th><th>HITS</th><th>TKA</th><th>SV</th><th>PIM</th></tr>
      <tr><td>${TEAMS[0].short}</td><td>${s0.goals}</td><td>${s0.shots}</td><td>${s0.hits}</td><td>${s0.takeaways}</td><td>${s0.saves}</td><td>${s0.pim}</td></tr>
      <tr><td>${TEAMS[1].short}</td><td>${s1.goals}</td><td>${s1.shots}</td><td>${s1.hits}</td><td>${s1.takeaways}</td><td>${s1.saves}</td><td>${s1.pim}</td></tr>
    </table>
    <button class="go" id="resume">Back to the ice</button>
  `;
}

function finish(){
  G.state='final';
  SFX.whistle();
  say(CALL.final(), true);
  const won = G.score[0]>G.score[1];
  const stars = pickStars();
  let careerLine = '';
  if(G.career){
    const s = G.stats[0];
    const earned = Math.round(s.goals*8 + s.hits*1 + s.takeaways*1 + (won?15:0));
    CAREER.points += earned; CAREER.games++; saveCareer();
    careerLine = `<div class="stars" style="margin-top:12px;color:#4ad07a">+${earned} career points — ${CAREER.points} total</div>`;
  }
  showOverlay(`
    <h1 style="font-size:30px">${won?TEAMS[0].short+' take it':TEAMS[1].short+' take it'}, ${G.score[0]}–${G.score[1]}</h1>
    <p class="lede">${won
      ? 'The barn empties happy. Sticks up to the corners.'
      : 'Tough night on home ice. The room is quiet.'}</p>
    <table class="stats">
      <tr><th></th><th>G</th><th>SOG</th><th>HITS</th><th>TKA</th><th>SV</th><th>PIM</th></tr>
      <tr><td>${TEAMS[0].short}</td><td>${G.stats[0].goals}</td><td>${G.stats[0].shots}</td><td>${G.stats[0].hits}</td><td>${G.stats[0].takeaways}</td><td>${G.stats[0].saves}</td><td>${G.stats[0].pim}</td></tr>
      <tr><td>${TEAMS[1].short}</td><td>${G.stats[1].goals}</td><td>${G.stats[1].shots}</td><td>${G.stats[1].hits}</td><td>${G.stats[1].takeaways}</td><td>${G.stats[1].saves}</td><td>${G.stats[1].pim}</td></tr>
    </table>
    <div class="stars">${stars}</div>
    ${careerLine}
    ${G.career ? `<button class="opt" id="toCareer" style="margin-top:14px;width:100%">Career upgrades</button>` : ''}
    <button class="go" id="again">Play again</button>
  `);
  document.getElementById('again').onclick = ()=> menu();
  if(G.career) document.getElementById('toCareer').onclick = ()=> openCareerHub();
}
function pickStars(){
  const list=[];
  for(let t=0;t<2;t++){
    for(const num in G.stats[t].scorers){
      const pl = TEAMS[t].roster.find(r=>r.n==num);
      list.push({label:`${pl?pl.name:'#'+num} (${TEAMS[t].short})`, v:G.stats[t].scorers[num]*10, note:`${G.stats[t].scorers[num]}G`});
    }
    const sv = G.stats[t].saves;
    list.push({label:`${TEAMS[t].roster[3].name} (${TEAMS[t].short})`, v:sv*1.6, note:`${sv} saves`});
  }
  list.sort((a,b)=>b.v-a.v);
  const names=['First star','Second star','Third star'];
  return list.slice(0,3).map((s,i)=>`<div><i>${names[i]}</i> — ${s.label}, ${s.note}</div>`).join('');
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last = performance.now(), acc = 0, paused=false;

function frame(now){
  let dt = (now-last)/1000; last = now;
  if(dt>0.25) dt = 0.25;
  if(G && !paused){
    if(G.state==='replay'){
      stepReplay();
    } else if(G.state!=='intermission' && G.state!=='final' && G.state!=='menu'){
      const scale = (G.state==='goal') ? 0.45 : 1;
      acc += dt*scale;
      let guard=0;
      while(acc >= DT && guard++ < 400){ step(DT); acc -= DT; if(!G) break; }
      if(G && (G.state==='play' || G.state==='faceoff')){
        buffer.push(snapshot());
        if(buffer.length>MAXBUF) buffer.shift();
      }
    }
    if(G.state!=='menu'){
      tickClock();
      if(Math.random()<0.06) updateBoard();
    }
  }
  if(G){
    let snap;
    if(G.state==='replay' && replay) snap = buffer[Math.floor(replay.i)] || snapshot();
    else snap = snapshot();
    draw(snap);
    const yaEl = document.getElementById('youAre');
    if(yaEl && G.state!=='menu'){
      const u = user();
      if(G.multiplayer){
        const u2 = user2();
        yaEl.innerHTML = (u? `<span style="color:#f2c14e">P1: #${u.num} ${u.name}</span>`:'')
          + (u2? `  &nbsp; <span style="color:#4ec9f2">P2: #${u2.num} ${u2.name}</span>`:'');
      } else {
        yaEl.innerHTML = u ? `<span style="color:#f2c14e">YOU: #${u.num} ${u.name} (${u.role})</span>` : '';
      }
    }
    const hintEl = document.getElementById('hint');
    if(hintEl && G.state!=='menu'){
      hintEl.innerHTML = G.multiplayer
        ? `<kbd>${keyLabel(BINDINGS[1].shoot)}</kbd> / <kbd>${keyLabel(BINDINGS[2].shoot)}</kbd> hold for a shot`
        : `Hold <kbd>${keyLabel(BINDINGS[1].shoot)}</kbd> to load a shot · <kbd>${keyLabel(BINDINGS[1].hit)}</kbd> to check · <kbd>${keyLabel(BINDINGS[1].swap)}</kbd> to switch`;
    }
  }
  requestAnimationFrame(frame);
}

function start(){
  hideOverlay();
  G = newGame({periodLen:OPTS.periodLen, diff:OPTS.diff, multiplayer:OPTS.multiplayer});
  G.career = OPTS.mode==='career';
  buffer = []; particles = []; replay=null;
  sctx.clearRect(0,0,scuff.width,scuff.height);
  resize();
  feed('Puck drop at Bayview Memorial', true);
  say(CALL.open(), true);
  updateBoard(); tickClock();
  setFaceoff({x:R.CX,y:R.CY});
  document.getElementById('touch').classList.toggle('on', isTouch);
}

addEventListener('keydown', e=>{
  if(!G) return;
  const k = e.key.toLowerCase();
  if(k==='p' && (G.state!=='menu' && G.state!=='final')){
    paused = !paused;
    if(paused) openPause(); else hideOverlay();
  }
  if(k==='r' && G.practice && !paused){
    const me = user();
    releasePuck(0);
    G.puck.owner = me; G.puck.x = me.x; G.puck.y = me.y; G.puck.vx=0; G.puck.vy=0;
    if(G.drill==='weave' && G.weave){ G.weave.idx=0; G.weave.running=false; }
    if(G.drill==='shoot' && G.gallery){ G.gallery.awaitingResult=false; G.gallery.respawnIn=null; }
  }
});
function openPause(){
  paused = true;
  showOverlay(`
    <h1 style="font-size:26px">Paused</h1>
    <p class="lede">The zamboni waits.</p>
    <button class="go" id="resume">Resume</button>
    <button class="opt" id="pauseControls" style="margin-top:10px;width:100%">Change controls</button>
    <button class="opt" id="pauseTeams" style="margin-top:10px;width:100%">Customize teams & roster</button>
    ${G && G.career ? `<button class="opt" id="pauseCareer" style="margin-top:10px;width:100%">Career upgrades — ★ ${CAREER.points}</button>` : ''}
    <button class="opt" id="pauseMenu" style="margin-top:10px;width:100%">Back to menu</button>
  `);
  document.getElementById('pauseControls').onclick = ()=> openControls('pause');
  document.getElementById('pauseTeams').onclick = ()=> openTeamEditor('pause');
  if(G && G.career) document.getElementById('pauseCareer').onclick = ()=> openCareerHub('pause');
  document.getElementById('pauseMenu').onclick = ()=>{
    paused = false;
    if(G) G.state = 'menu';   // freezes the frame loop's stepping/clock, same as the pre-game idle state
    menu();
  };
}
overlay.addEventListener('click', e=>{
  if(e.target.id==='resume'){
    paused=false; hideOverlay();
    if(G.state==='intermission'){ G.ot ? setFaceoff({x:R.CX,y:R.CY}) : setFaceoff({x:R.CX,y:R.CY}); }
  }
});

/* ---------------- touch ---------------- */
(function(){
  const stick=document.getElementById('stick'), nub=document.getElementById('nub');
  let id=null, cx=0, cy=0;
  const set=(dx,dy)=>{
    const m=Math.hypot(dx,dy), lim=38;
    const k=m>lim?lim/m:1;
    nub.style.left=(38+dx*k)+'px'; nub.style.top=(38+dy*k)+'px';
    touchAxis.x = clamp(dx/lim,-1,1); touchAxis.y = clamp(dy/lim,-1,1);
  };
  stick.addEventListener('touchstart',e=>{
    const t=e.changedTouches[0]; id=t.identifier;
    const r=stick.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2;
    set(t.clientX-cx,t.clientY-cy); audio(); e.preventDefault();
  },{passive:false});
  stick.addEventListener('touchmove',e=>{
    for(const t of e.changedTouches) if(t.identifier===id) set(t.clientX-cx,t.clientY-cy);
    e.preventDefault();
  },{passive:false});
  const end=e=>{ for(const t of e.changedTouches) if(t.identifier===id){ id=null; set(0,0); } };
  stick.addEventListener('touchend',end); stick.addEventListener('touchcancel',end);

  const bind=(el,key)=>{
    const d=document.getElementById(el);
    d.addEventListener('touchstart',e=>{touchBtn[key]=true; audio(); e.preventDefault();},{passive:false});
    d.addEventListener('touchend',e=>{touchBtn[key]=false; e.preventDefault();},{passive:false});
    d.addEventListener('touchcancel',()=>touchBtn[key]=false);
  };
  bind('bShot','shoot'); bind('bPass','pass'); bind('bHit','hit');
})();

/* ---------------- boot ---------------- */
loadCareer();
G = newGame({periodLen:OPTS.periodLen, diff:OPTS.diff, multiplayer:OPTS.multiplayer});
setFaceoff({x:R.CX,y:R.CY});
G.state='menu';
resize();
menu();
ambientTick();
requestAnimationFrame(frame);
</script>
